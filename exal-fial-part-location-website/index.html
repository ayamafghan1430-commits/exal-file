<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exal Fial | Part Location Search</title>
<meta name="description" content="Search a part number and find its warehouse location.">
<style>
:root {
  --bg:#07090d; --panel:#11151d; --border:#26303d; --text:#f5f7fb;
  --muted:#9aa6b5; --accent:#8b7cff; --accent2:#5eead4;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 50% 0%,#1b1734 0,transparent 35%),var(--bg);
color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 6%;border-bottom:1px solid var(--border);
background:rgba(7,9,13,.82);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:1.2rem}
main{max-width:1050px;margin:auto;padding:70px 6%}
.hero{text-align:center;padding:45px 0 35px}
.badge{display:inline-block;padding:7px 12px;border:1px solid #3b355d;border-radius:999px;color:#b8afff;font-size:.8rem;font-weight:700}
h1{font-size:clamp(2.7rem,7vw,5.5rem);line-height:1;margin:18px 0;letter-spacing:-.05em}
h1 span{color:#9b8fff}
.sub{color:var(--muted);max-width:650px;margin:auto;font-size:1.05rem}
.searchbox{margin:34px auto 0;display:flex;max-width:720px;gap:10px}
input{flex:1;min-width:0;background:#0e131a;border:1px solid #394453;color:white;border-radius:14px;padding:17px 18px;font-size:1rem;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,124,255,.15)}
button{border:0;border-radius:14px;padding:0 25px;background:white;color:#0a0b0f;font-weight:800;font-size:1rem;cursor:pointer}
#status{margin-top:18px;color:var(--muted);min-height:24px}
.result{display:none;margin:28px auto 0;max-width:720px;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:26px;text-align:left}
.result.show{display:block}
.result-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.part{font-size:1.4rem;font-weight:800}
.location{font-size:clamp(2rem,7vw,4rem);font-weight:900;color:var(--accent2);line-height:1.05;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.info{padding:15px;background:#0c1117;border:1px solid #222c38;border-radius:14px}
.label{font-size:.75rem;color:#7f8b99;text-transform:uppercase;letter-spacing:.12em}
.value{margin-top:4px;font-weight:700;word-break:break-word}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:35px}
.stat{border:1px solid var(--border);background:#0d1117;border-radius:14px;padding:13px 17px;color:var(--muted)}
.stat b{color:white}
.help{margin-top:70px;color:var(--muted);text-align:center}
footer{border-top:1px solid var(--border);padding:28px 6%;text-align:center;color:#6f7a88}
@media(max-width:650px){
 header{padding:16px 5%} main{padding:45px 5%} .searchbox{flex-direction:column}
 button{height:54px} .grid{grid-template-columns:1fr} .result-top{flex-direction:column}
}
</style>
</head>
<body>
<header><div class="logo">Exal Fial</div><div>Part Location Search</div></header>
<main>
<section class="hero">
  <div class="badge">INVENTORY LOOKUP</div>
  <h1>Find a <span>part.</span><br>Find its location.</h1>
  <p class="sub">Enter a part number from the inventory list and the website will show the matching location, description, and quantity.</p>
  <div class="searchbox">
    <input id="search" type="search" placeholder="Enter part number..." autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>
  <div id="status"></div>
  <div id="result" class="result"></div>
  <div class="stats">
    <div class="stat"><b id="partCount">0</b> inventory rows</div>
    <div class="stat"><b id="locationCount">0</b> locations</div>
  </div>
</section>
<section class="help">
  <p>Tip: you can type the full part number or part of it.</p>
</section>
</main>
<footer>© <span id="year"></span> Exal Fial</footer>

const search = document.getElementById('search');
const result = document.getElementById('result');
const status = document.getElementById('status');

function norm(v) {
  return String(v || '').replace(/[\u202a\u202c\u200b]/g,'').trim().toLowerCase();
}

function doSearch() {
  const q = norm(search.value);
  result.classList.remove('show');
  if (!q) {
    status.textContent = 'Enter a part number to search.';
    return;
  }
  const matches = inventory.filter(x => norm(x.part_number).includes(q));
  if (!matches.length) {
    status.textContent = 'No matching part number was found.';
    return;
  }
  status.textContent = matches.length === 1 ? '1 match found.' : `${matches.length} matches found.`;
  result.innerHTML = matches.map(x => `
    <div class="result-top">
      <div>
        <div class="label">Part number</div>
        <div class="part">${escapeHtml(x.part_number || '—')}</div>
      </div>
      <div>
        <div class="label">Location</div>
        <div class="location">${escapeHtml(x.location || 'Not listed')}</div>
      </div>
    </div>
    <div class="grid">
      <div class="info"><div class="label">Description</div><div class="value">${escapeHtml(x.description || 'Not listed')}</div></div>
      <div class="info"><div class="label">Quantity</div><div class="value">${escapeHtml(x.quantity || 'Not listed')}</div></div>
    </div>
  `).join('<hr style="border:0;border-top:1px solid #26303d;margin:24px 0">');
  result.classList.add('show');
}

function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('searchBtn').addEventListener('click', doSearch);
search.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.getElementById('partCount').textContent = inventory.length;
document.getElementById('locationCount').textContent = new Set(inventory.map(x => x.location).filter(Boolean)).size;
document.getElementById('year').textContent = new Date().getFullYear();
</script>
